<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Poika Custom Night</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="Assets/icon.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="menu">
            <div id="menuBackground2"></div>
            <div id="menuBackground"></div>
            <div id="characters">
                <div id="rightSideBar">
                    <div style="color: white; font-size: 24px;">Aggressive:<input id="aggressiveCB" type="checkbox" style="scale: 1.2;"></div>
                    <div style="color: white; font-size: 0px;">W.I.P:<input id="hyperCB" type="checkbox" style="scale: 0;"></div>
                    <div style="color: white; font-size: 24px;">Long Nights:<input id="LNCB" type="checkbox" style="scale: 1.2;"></div>
                    <div id="timeCounter" style="color: white; font-size: 20px;">Ingame: 0:00</div>
                    <div id="deathCounter" style="color: white; font-size: 20px;">Death counter: 0</div>
                    <div style="text-align: center;">
                        <img class="achievement" id="AC_1" draggable="false" src="Assets/Achievements/EC.png" width="32px">
                        <img class="achievement" id="AC_2" draggable="false" src="Assets/Achievements/HEC.png" width="32px">
                        <img class="achievement" id="AC_3" draggable="false" src="Assets/Achievements/AEC.png" width="32px">
                        <img class="achievement" id="AC_4" draggable="false" src="Assets/Achievements/AHEC.png" width="32px">
                        <img class="achievement" id="AC_5" draggable="false" src="Assets/Achievements/ECAC.png" width="32px">
                        <img class="achievement" id="AC_6" draggable="false" src="Assets/Achievements/poikacide.png" width="32px">
                        <img class="achievement" id="AC_7" draggable="false" src="Assets/Achievements/hyperPoikacide.png" width="32px">
                        <img class="achievement" id="AC_8" draggable="false" src="Assets/Achievements/aggressivePoikacide.png" width="32px">
                        <img class="achievement" id="AC_9" draggable="false" src="Assets/Achievements/Genopoikacide.png" width="32px">
                        <img class="achievement" id="AC_10" draggable="false" src="Assets/Achievements/PCAC.png" width="32px">
                        <img class="achievement" id="AC_11" draggable="false" src="Assets/Achievements/BM.png" width="32px">
                        <img class="achievement" id="AC_12" draggable="false" src="Assets/Achievements/HBM.png" width="32px">
                        <img class="achievement" id="AC_13" draggable="false" src="Assets/Achievements/ABM.png" width="32px">
                        <img class="achievement" id="AC_14" draggable="false" src="Assets/Achievements/AHBM.png" width="32px">
                        <img class="achievement" id="AC_15" draggable="false" src="Assets/Achievements/BMAC.png" width="32px">
                        <img class="achievement" id="AC_16" draggable="false" src="Assets/Achievements/EBM.png" width="32px">
                        <img class="achievement" id="AC_17" draggable="false" src="Assets/Achievements/HEBM.png" width="32px">
                        <img class="achievement" id="AC_18" draggable="false" src="Assets/Achievements/AEBM.png" width="32px">
                        <img class="achievement" id="AC_19" draggable="false" src="Assets/Achievements/HAEBM.png" width="32px">
                        <img class="achievement" id="AC_20" draggable="false" src="Assets/Achievements/EBMAC.png" width="32px">
                    </div>
                    <div width="50px" style="background-color: black; opacity: 0;"></div>
                    <div style="position: absolute; bottom: 0; left: 0; text-align: center;">
                        <button id="easycide" style="color: lightblue; width: 100%; height: 50px; scale: 0.9; font-size: 30px; font-family: intenseFont; background-color: blue; background-size: cover;">Easycide</button>
                        <div style="color: red; font-size: 24px;">ETERNAL:<input id="eternalBM" type="checkbox" style="scale: 1.2;"></div>
                        <button id="beemsaManStart" style="transition: ease 0.2s; width: 100%; height: 50px; font-size: 30px; scale: 0.9; font-family: intenseFont; background-image: url(Assets/redStatic.gif); background-size: cover; color: white; border: solid darkred 5px;">BEEMSA MAN</button>
                        <button id="all10" style="width: 100%; height: 50px; font-size: 30px; scale: 0.9; font-family: cursive;">All 10</button>
                        <button id="all20" style="width: 100%; height: 50px; font-size: 30px; scale: 0.9; font-family: cursive;">All 20</button>
                        <button id="startButton" style="width: 100%; height: 50px; font-size: 30px; scale: 0.9; font-family: cursive;">start</button>
                    </div>
                </div>
            </div>
            <div id="characterDescription">
                <div id="cdName" style="font-size: 39px; color:white;">fdsafads</div>
                <div id="cdDescription" style="font-size: 24px; color:white;">sdafadfs</div>
            </div>
            <div id="settings">
                
            </div>
            <div style="width: 10px; height: 500px; background-color: white;"></div>
        </div>
        <div id="ingame">
            <div id="theOffice">
                <div class="inOffice" id="office"></div>
                <div class="inOffice" id="leftDoor"></div>
                <div class="inOffice" id="rightDoor"></div>
                <div class="inOffice" id="leftVent"></div>
                <div class="inOffice" id="rightVent"></div>
                <div class="inOffice" id="desk"></div>
            </div>
            <div id="flashlight"></div>
            <div id="mask"></div>
            <div id="camSystem">
                <div id="cameraImage"></div>
                <div id="camStatic"></div>
                <div id="camButtons">
                    <button class="camButton" id="cam0" data-value="0">CAM 0</button>
                    <button class="camButton" id="cam1" data-value="1">CAM 1</button>
                    <button class="camButton" id="cam2" data-value="2">CAM 2</button>
                    <button class="camButton" id="cam3" data-value="3">CAM 3</button>
                    <button class="camButton" id="cam4" data-value="4">CAM 4</button>
                    <button class="camButton" id="cam5" data-value="5">CAM 5</button>
                    <button class="camButton" id="cam6" data-value="6">CAM 6</button>
                    <button class="camButton" id="cam7" data-value="7">CAM 7</button>
                    <button class="camButton" id="cam8" data-value="8">CAM 8</button>
                </div>
                <div id="unkkaTeleport">Teleport</div>
                <input id="jinkuType" type="text">
                <div id="beemsaTimer">Beemsa Man: 4.00s</div>
            </div>
            <div id="ingameCharacters">
                
            </div>
            <img id="camOpenAnimation" src="Assets/camOpen.gif"></img>
            <div id="vignette"></div>
            <div id="textUI">
                <div id="powerUI">Power: 100%</div>
                <div id="timeUI">0:00AM</div>
            </div>
            <div id="beemsaManStatic"></div>
        </div>
        <div id="deathAnimation">
            <img id="deathImage">
            <div id="killAnim"></div>
            <div id="deathText">
                <div id="gameOverText" style="position: absolute; left: 50%; top: 50%; transform:translate(-50%, -50%); color:red; font-size: 10vh; font-family: Arial; width: 100%; text-align: center;">GAME OVER</div>
                <div id="gameOverTime" style="position: absolute; left: 50%; top: 60%; transform:translate(-50%, -50%); color:red; font-size: 5vh; font-family: digital-7; width: 100%; text-align: center;">Time: </div>
                <button id="retryButton">Retry</button>
                <button id="goBackButton">Go Back</button>
            </div>
        </div>
        <div id="blackTransition"></div>
        <div id="cutscene" style="display: none">
            <div id="csCenterText" style="position: absolute; left: 50%; top: 50%; transform:translate(-50%, -50%); color: white; z-index: 100; white-space: nowrap;">Custom Night</div>
        </div>
        <div id="true5">
            <div id="beemsaManTimer">1 AM</div>
            <img id="beemsaManMan" src="Assets/beemsOg.png" draggable="false">
        </div>
        <div id="beemsCutscene">
            <img src="Assets/Characters/beems.png">
            <div id="bcText"></div>
            <button id="bcButton">Next...</button>
        </div>
        <div id="menuStatic"></div>
        <div id="6AM" style="z-index: 17;display: block; pointer-events: none; user-select: none; opacity: 0; position: absolute; font-size: 30vh; left: 50%; top: 50%; transform:translate(-50%, -50%); font-family: digital-7; color: white">6:00</div>
        <script src="script.js"></script>
    </body>
</html>
